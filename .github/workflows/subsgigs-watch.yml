name: SubsGigs watcher

on:
  schedule:
    - cron: "*/5 * * * *"  # every 5 minutes (GitHub may delay runs at busy times)
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send a test alert instead of checking the site"
        type: boolean
        default: false

permissions:
  contents: write  # to commit the saved snapshot

concurrency:
  group: subsgigs-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: watcher/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r watcher/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Check campaigns
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          SEND_TEST_ALERT: ${{ inputs.test_alert }}
        run: python watcher/subsgigs_watch.py

      - name: Save snapshot
        run: |
          git config user.name "subsgigs-watcher"
          git config user.email "subsgigs-watcher@users.noreply.github.com"
          git add watcher/state.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "watcher: update SubsGigs snapshot [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
